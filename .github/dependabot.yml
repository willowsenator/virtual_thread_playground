version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      docker:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
    ignore:
      # The base image's major is the JDK release; stay on an LTS line (25) and move to the next
      # LTS by hand instead of following every six-monthly feature release.
      - dependency-name: "bellsoft/liberica-openjdk-alpine"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
  - package-ecosystem: "gradle"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    groups:
      gradle:
        update-types: ["minor", "patch"]
        patterns:
          - "*"
